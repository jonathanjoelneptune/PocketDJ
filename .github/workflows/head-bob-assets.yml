name: Generate DJ NES Head Bob Assets

on:
  push:
    branches:
      - main
      - feature/organic-head-bob
    paths:
      - 'scripts/build_head_bob_assets.py'
      - 'scripts/head_gap_repair.py'
      - 'public/assets/DJ NES Pose Library/Head Bob lab/manual_repairs/**'
      - 'public/assets/DJ NES Pose Library/Head Bob lab/vibe_rigs.json'
      - 'public/assets/DJ NES Pose Library/Head Bob lab/**/head_bob_rig.json'
      - '.github/workflows/head-bob-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pixel-accurate PNG tools
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Generate scratch and vibe head/body layers
        run: python scripts/build_head_bob_assets.py
      - name: Commit generated artwork to the pose library
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/assets/DJ NES Pose Library/Head Bob lab/"
          if ! git diff --cached --quiet; then
            git commit -m "Generate pixel-accurate head bob layers from approved rigs"
            git push origin HEAD:main
          fi
