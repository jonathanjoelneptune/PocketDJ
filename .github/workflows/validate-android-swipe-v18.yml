name: Validate Android v1.8 native swipe router

on:
  push:
    branches: [experimental/android-swipe-router-v1-8]
    paths:
      - experiments/spotify-swipe-router-v1.8/**
      - .github/workflows/validate-android-swipe-v18.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/spotify-swipe-router-v1.8/**
      - .github/workflows/validate-android-swipe-v18.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android swipe hosts
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM="$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          D8="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          test -f "$PLATFORM"
          test -x "$D8"
          mkdir -p /tmp/pdj-v18-stubs /tmp/pdj-v18-classes /tmp/pdj-v18-dex
          find experiments/spotify-swipe-router-v1.8/stubs -type f -name '*.java' > /tmp/pdj-stubs.txt
          javac -source 8 -target 8 -cp "$PLATFORM" \
            -d /tmp/pdj-v18-stubs @/tmp/pdj-stubs.txt
          find experiments/spotify-swipe-router-v1.8/src -type f -name '*.java' > /tmp/pdj-src.txt
          javac -source 8 -target 8 -cp "$PLATFORM:/tmp/pdj-v18-stubs" \
            -d /tmp/pdj-v18-classes @/tmp/pdj-src.txt
          mapfile -t CLASSES < <(find /tmp/pdj-v18-classes/com/pocketdj/spotifyexperiment -type f -name '*.class')
          test "${#CLASSES[@]}" -ge 5
          "$D8" --min-api 26 --lib "$PLATFORM" --classpath /tmp/pdj-v18-stubs \
            --output /tmp/pdj-v18-dex "${CLASSES[@]}"
          test -s /tmp/pdj-v18-dex/classes.dex
          sha256sum /tmp/pdj-v18-dex/classes.dex
      - name: Upload original PocketDJ gesture DEX
        uses: actions/upload-artifact@v4
        with:
          name: pocketdj-v18-swipe-dex
          path: /tmp/pdj-v18-dex/classes.dex
          retention-days: 20
