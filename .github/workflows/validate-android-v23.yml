name: Validate Android v2.3 native session and artwork pager

on:
  push:
    branches: [experimental/android-artwork-v2-3]
    paths:
      - experiments/spotify-artwork-v2.3/**
      - .github/workflows/validate-android-v23.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/spotify-artwork-v2.3/**
      - .github/workflows/validate-android-v23.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android SDK classes and create DEX
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM="$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          D8="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          test -f "$PLATFORM"
          test -x "$D8"
          mkdir -p /tmp/pdj-v23-stubs /tmp/pdj-v23-classes /tmp/pdj-v23-dex
          find experiments/spotify-artwork-v2.3/stubs -name '*.java' > /tmp/pdj21-stubs.txt
          javac -source 8 -target 8 -cp "$PLATFORM" -d /tmp/pdj-v23-stubs @/tmp/pdj21-stubs.txt
          find experiments/spotify-artwork-v2.3/src -name '*.java' > /tmp/pdj21-src.txt
          javac -source 8 -target 8 -cp "$PLATFORM:/tmp/pdj-v23-stubs" -d /tmp/pdj-v23-classes @/tmp/pdj21-src.txt
          mapfile -t CLASSES < <(find /tmp/pdj-v23-classes/com/pocketdj/spotifyexperiment -name '*.class')
          test "${#CLASSES[@]}" -ge 8
          "$D8" --min-api 26 --lib "$PLATFORM" --classpath /tmp/pdj-v23-stubs \
            --output /tmp/pdj-v23-dex "${CLASSES[@]}"
          test -s /tmp/pdj-v23-dex/classes.dex
          sha256sum /tmp/pdj-v23-dex/classes.dex
      - name: Upload experimental native dex
        uses: actions/upload-artifact@v4
        with:
          name: pocketdj-v23-session-swipe-dex
          path: /tmp/pdj-v23-dex/classes.dex
          retention-days: 20
