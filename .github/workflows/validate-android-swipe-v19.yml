name: Validate Android v1.9 swipe page effects

on:
  push:
    branches: [experimental/android-bidirectional-v1-9]
    paths:
      - experiments/spotify-swipe-v1.9/**
      - .github/workflows/validate-android-swipe-v19.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/spotify-swipe-v1.9/**
      - .github/workflows/validate-android-swipe-v19.yml

permissions:
  contents: read

jobs:
  compile-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android swipe page sources
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM="$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          D8="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          test -f "$PLATFORM"
          test -x "$D8"
          mkdir -p /tmp/pdj19-stubs /tmp/pdj19-classes /tmp/pdj19-dex
          find experiments/spotify-swipe-v1.9/stubs -type f -name '*.java' > /tmp/pdj19-stubs.txt
          javac -source 8 -target 8 -cp "$PLATFORM" -d /tmp/pdj19-stubs @/tmp/pdj19-stubs.txt
          find experiments/spotify-swipe-v1.9/src -type f -name '*.java' > /tmp/pdj19-src.txt
          javac -source 8 -target 8 -cp "$PLATFORM:/tmp/pdj19-stubs" -d /tmp/pdj19-classes @/tmp/pdj19-src.txt
          mapfile -t CLASSES < <(find /tmp/pdj19-classes/com/pocketdj/spotifyexperiment -type f -name '*.class')
          test "${#CLASSES[@]}" -ge 6
          "$D8" --min-api 26 --lib "$PLATFORM" --classpath /tmp/pdj19-stubs --output /tmp/pdj19-dex "${CLASSES[@]}"
          test -s /tmp/pdj19-dex/classes.dex
          sha256sum /tmp/pdj19-dex/classes.dex
      - name: Upload compiled PocketDJ v1.9 DEX
        uses: actions/upload-artifact@v4
        with:
          name: pocketdj-v19-pages-dex
          path: /tmp/pdj19-dex/classes.dex
          retention-days: 21
