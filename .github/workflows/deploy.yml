name: Deploy Pocket DJ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Deployment events run in the main-branch workflow context, satisfying
  # GitHub Pages' protected github-pages environment branch restrictions.
  workflow_run:
    workflows:
      - Validate PocketDJ Pull Request
    types:
      - completed
    branches:
      - feature/festival-stage-scenes-wp1-5

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages publishes one revision at a time. The newest commit wins;
# cancel an older run rather than queueing behind a stalled deployment.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Always build production from main, including when preview branch updates.
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show versions
        run: |
          node --version
          corepack --version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Python for DJ head bob layers
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pixel-accurate head bob layers
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy
          python scripts/build_head_bob_assets.py

      - name: Reconstruct final calibrated scratching rigs
        run: python scripts/build_scratch_rig_assets.py

      - name: Test beat clock, scratch blends, and speaker pulse
        run: pnpm run test:animation

      - name: Build site
        run: pnpm run build

      # Build the unmerged experimental branch into /festival/.
      # A preview failure must never prevent a working production deployment.
      - name: Checkout experimental Festival Stage source
        id: festival_checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: feature/festival-stage-scenes-wp1-5
          path: festival-preview-source
          persist-credentials: false

      - name: Build experimental Festival Stage
        id: festival_build
        if: steps.festival_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: ./festival-preview-source
        run: |
          pnpm install --no-frozen-lockfile
          python scripts/build_head_bob_assets.py
          python scripts/build_scratch_rig_assets.py
          pnpm run build

      - name: Publish Festival Stage beneath /festival/
        if: steps.festival_build.outcome == 'success'
        run: |
          mkdir -p dist/festival
          cp -a festival-preview-source/dist/. dist/festival/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
