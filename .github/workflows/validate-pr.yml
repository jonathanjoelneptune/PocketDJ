name: Validate PocketDJ Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup Python for DJ head bob layers
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pixel-accurate head bob layers
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy
          python scripts/build_head_bob_assets.py

      - name: Test beat clock, scratch blends, and speaker pulse
        run: pnpm run test:animation

      - name: Build site
        run: pnpm run build

      - name: Visual QA - headless festival screenshot
        run: |
          set -e
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/festival-vite.log 2>&1 &
          sleep 4
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1764,992 --virtual-time-budget=8000 --screenshot=/tmp/festival-stage.png 'http://127.0.0.1:4173/?scene=festival'
          python - <<'PY'
          from PIL import Image
          import base64,io
          image=Image.open('/tmp/festival-stage.png').convert('RGB')
          image.thumbnail((1080,608))
          out=io.BytesIO()
          image.save(out,format='JPEG',quality=58,optimize=True)
          print('FESTIVAL_SCREENSHOT_BEGIN')
          print(base64.b64encode(out.getvalue()).decode())
          print('FESTIVAL_SCREENSHOT_END')
          PY
