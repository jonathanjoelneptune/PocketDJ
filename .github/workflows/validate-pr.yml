name: Validate PocketDJ Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup Python for DJ head bob layers
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pixel-accurate head bob layers
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy
          python scripts/build_head_bob_assets.py

      - name: Test beat clock, scratch blends, and speaker pulse
        run: pnpm run test:animation

      - name: Build site
        run: pnpm run build
